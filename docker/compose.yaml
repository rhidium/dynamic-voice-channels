services:
  client:
    container_name: dvc-client
    build:
      context: ../
      target: client
      dockerfile: ./docker/Dockerfile
      args:
        - CI=true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: ../.env
    environment:
      CI: true
      NODE_ENV: production
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
    volumes:
      - ../logs:/app/logs:rw
      - ../config/:/app/config:r
      # Note: Prisma is included as a volume to allow for database migrations without having to rebuild the client container
      - ../prisma:/app/prisma:r
      - ../prisma.config.ts:/app/prisma.config.ts:r
    networks:
      - dvc-network

  database:
    container_name: dvc-database
    image: postgres:15
    restart: always
    shm_size: 128mb
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 2s
      retries: 20
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - dvc-network
    volumes:
      - pg-data:/var/lib/postgresql/data
    logging:
      options:
        max-size: '10m'
        max-file: '3'

networks:
  dvc-network:
    name: dvc-network
    driver: bridge

volumes:
  pg-data:
    name: dvc-pg-data
    driver: local
