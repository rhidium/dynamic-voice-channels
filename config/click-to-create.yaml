# Click-to-Create Voice Channels Configuration
# This file defines trigger channels that automatically create temporary voice channels

# YAML Anchor/Alias Guide for Reusable Permissions:
# Define an anchor with &name on first use, then reference with *name anywhere after
# Use merge keys (<<:) to copy and override specific fields

# Note: This configuration is used to test the application, schema generation and validation.
# You should remove or modify it according to your needs.
- channelId: "1457366395825164494"
  categoryId: "1222669266113921116"
  maxChannels: 15
  channelName: "{creator}'s Channel"
  channelUserLimit: 5
  channelBitrate: 64000
  channelPositionAnchor: "1457366395825164494"
  channelPermissions:
    # Note: Allow base VC permissions for everyone, but deny Connect.
    # That way, once user's join (are moved by creator or staff), they can speak, stream, etc.
    - &everyone-channel-perms
      roleId: "@everyone"
      allow:
        - ViewChannel # Everyone can see created channels
        - UseVAD # Allow voice activity detection
        - Speak # Allow speaking
        - Stream # Allow streaming
        - UseSoundboard # Allow use of soundboard
        - UseExternalSounds # Allow use of external sounds
        - SendMessages # Allow anyone to use the voice channel text chat (to request access/moving, etc.)
      deny:
        - Connect # Prevent everyone from joining by default
        - EmbedLinks # Prevent link embedding in channel chat
        - AttachFiles # Prevent file attachments in channel chat
        - AddReactions # Prevent reactions in channel chat
        - ReadMessageHistory # Non-VC members don't need to read history
    - &creator-channel-perms
      roleId: "{{creatorId}}"
      allow:
        - Connect
        - ViewChannel
        - UseVAD
        - Speak
        - Stream
        - UseSoundboard
        - UseExternalSounds
        - SendMessages
        - EmbedLinks
        - AttachFiles
        - AddReactions
        - ReadMessageHistory
        - SendVoiceMessages
        - SendTTSMessages
        - SendPolls
        - UseApplicationCommands
        - UseEmbeddedActivities
        - UseExternalApps
        - MoveMembers
        - ManageChannels
        - ManageRoles
      deny: []
    - &staff-channel-perms
      roleId:
        - "1227748659127521360" # Community Manager
        - "1228124708952608820" # Head Admin
        - "1112020551817502860" # Administrator
        - "1228125291293970543" # Administration
        - "1228124701688205383" # Senior Moderator
        - "1112020086820184196" # Moderator
        - "1228125295379480598" # Moderation
        - "1228125711496249344" # Staff Team
      allow:
        - Connect
        - ViewChannel
        - UseVAD
        - Speak
        - Stream
        - UseSoundboard
        - UseExternalSounds
        - SendMessages
        - EmbedLinks
        - AttachFiles
        - AddReactions
        - ReadMessageHistory
        - SendVoiceMessages
        - SendTTSMessages
        - SendPolls
        - UseApplicationCommands
        - UseEmbeddedActivities
        - UseExternalApps
        - MoveMembers
        - ManageChannels
        - ManageRoles
        - MuteMembers
        - DeafenMembers
        - ManageMessages
      deny: []

# Example: Reuse the same permission structure in another config
- channelId: "9876543210987654321"
  categoryId: "1222669266113921117"
  maxChannels: 5
  channelName: "Private Room - {creator}"
  channelUserLimit: 4
  channelBitrate: 128000
  channelPermissions:
    - *creator-channel-perms   # Reuse creator permissions
    - *staff-channel-perms     # Reuse staff permissions  
    - *everyone-channel-perms  # Reuse everyone permissions

